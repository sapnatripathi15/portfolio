<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found | Sapna Tripathi</title>
<link rel="stylesheet" href="styles.css">
<style>
.error-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f7fbff,#eaf4fb)}
.error-card{max-width:720px;text-align:center}
.error-card strong{font-family:Manrope,sans-serif;font-size:clamp(5rem,18vw,10rem);color:#164f7d;line-height:.9}
.error-card h1{font-family:Manrope,sans-serif;font-size:2rem;color:#0b2a4a;margin:24px 0 10px}
.error-card p{color:#657487;margin:0 0 28px}
</style>
</head>
<body>
<main class="error-wrap">
<section class="error-card">
<strong>404</strong>
<h1>This page isn’t part of the journey.</h1>
<p>The page you’re looking for doesn’t exist. The portfolio is one click away.</p>
<a class="button button-primary" href="./">Return home</a>
</section>
</main>
</body>
</html>
